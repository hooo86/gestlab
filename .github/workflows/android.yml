# Construit l'application Android « Gestlab ERP » (Odoo + VPN intégré).
# Lancer : GitHub › Actions › « Gestlab ERP (Android) » › Run workflow,
# ou automatiquement à chaque modification du dossier .
# Télécharger ensuite « gestlab-apk » (installation directe) et « gestlab-aab »
# (fichier à envoyer sur Google Play) dans les Artifacts de l'exécution.
#
# Secrets GitHub (Settings › Secrets and variables › Actions) :
#   OVPN_CONFIG_BASE64        fichier client.ovpn encodé en base64 (obligatoire)
#   GESTLAB_KEYSTORE_BASE64   clé de signature .jks en base64 (pour Google Play)
#   GESTLAB_KEYSTORE_PASSWORD, GESTLAB_KEY_ALIAS, GESTLAB_KEY_PASSWORD
name: Gestlab ERP (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Outils natifs (SWIG, NDK)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q swig
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.14904198" > /dev/null

      - name: Cache du moteur OpenVPN
        uses: actions/cache@v4
        with:
          path: vendor
          key: ics-openvpn-${{ hashFiles('scripts/setup-vpnlib.sh', 'vpnlib/build.gradle.kts') }}

      - name: Moteur OpenVPN (ics-openvpn)
        run: ./scripts/setup-vpnlib.sh

      - name: Fichier de configuration VPN
        env:
          OVPN_CONFIG_BASE64: ${{ secrets.OVPN_CONFIG_BASE64 }}
        run: |
          if [ -n "$OVPN_CONFIG_BASE64" ]; then
            OUT=app/src/main/assets/client.ovpn
            printf '%s\n' "$OVPN_CONFIG_BASE64" > "$RUNNER_TEMP/ovpn.in"
            # Le secret peut contenir le fichier .ovpn tel quel (copié-collé) ou encodé en base64.
            if grep -qE '^[[:space:]]*(client|remote|dev|proto|<ca>)([[:space:]]|$)' "$RUNNER_TEMP/ovpn.in"; then
              tr -d '\r' < "$RUNNER_TEMP/ovpn.in" > "$OUT"
            elif tr -d ' \r\n\t' < "$RUNNER_TEMP/ovpn.in" | base64 -d > "$RUNNER_TEMP/ovpn.dec" 2>/dev/null; then
              tr -d '\r' < "$RUNNER_TEMP/ovpn.dec" > "$OUT"
            else
              echo "::error::Le secret OVPN_CONFIG_BASE64 n'est ni un fichier .ovpn ni du base64 valide."
              exit 1
            fi
            rm -f "$RUNNER_TEMP/ovpn.dec"
            rm -f "$RUNNER_TEMP/ovpn.in"
            grep -qE '^[[:space:]]*remote[[:space:]]' "$OUT" \
              || { echo "::error::Configuration VPN invalide : aucune ligne « remote »."; exit 1; }
            grep -q "auth-user-pass" "$OUT" \
              || echo "::warning::La configuration VPN ne contient pas auth-user-pass."
          else
            echo "::warning::Secret OVPN_CONFIG_BASE64 absent : l'application n'aura pas de configuration VPN."
          fi

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.GESTLAB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GESTLAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GESTLAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GESTLAB_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Retire les retours à la ligne / espaces parasites d'un copier-coller.
            trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
            STORE_PASS=$(trim "$KEYSTORE_PASSWORD")
            ALIAS=$(trim "$KEY_ALIAS")
            KEY_PASS=$(trim "$KEY_PASSWORD")
            [ -n "$KEY_PASS" ] || KEY_PASS="$STORE_PASS"
            JKS="$RUNNER_TEMP/gestlab.jks"
            if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$JKS" 2>/dev/null; then
              echo "::error::GESTLAB_KEYSTORE_BASE64 n'est pas du base64 valide (refaire l'étape C avec gestlab.jks)."
              exit 1
            fi
            # Vérifications avant la compilation, avec un message clair.
            if ! keytool -list -keystore "$JKS" -storepass "$STORE_PASS" > /dev/null 2>&1; then
              echo "::error::GESTLAB_KEYSTORE_PASSWORD incorrect (ou GESTLAB_KEYSTORE_BASE64 ne vient pas du bon fichier gestlab.jks)."
              exit 1
            fi
            if ! keytool -list -keystore "$JKS" -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1; then
              echo "::error::Alias introuvable dans la clé : GESTLAB_KEY_ALIAS doit être celui donné à keytool (-alias gestlab)."
              keytool -list -keystore "$JKS" -storepass "$STORE_PASS" | grep -i "PrivateKeyEntry" | sed 's/,.*//' | sed 's/^/Alias présent : /'
              exit 1
            fi
            # Clé au format PKCS12 (format par défaut de keytool) : le mot de passe de la clé
            # est toujours celui du keystore, quel que soit GESTLAB_KEY_PASSWORD.
            if keytool -list -keystore "$JKS" -storepass "$STORE_PASS" 2>/dev/null | grep -qi "PKCS12"; then
              KEY_PASS="$STORE_PASS"
            fi
            {
              echo "GESTLAB_STORE_FILE=$JKS"
              echo "GESTLAB_STORE_PASSWORD=$STORE_PASS"
              echo "GESTLAB_KEY_ALIAS=$ALIAS"
              echo "GESTLAB_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Clé de signature vérifiée."
          else
            echo "::warning::Pas de clé de signature : APK signé avec la clé de debug (non publiable sur Google Play)."
          fi

      - name: Compilation (APK + App Bundle)
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease -PversionCode=${{ github.run_number }}

      - name: Empreinte du certificat
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner|SHA1|SHA256" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gestlab-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: gestlab-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
